version: 0.2.0.dev0
name: tpcds_retail_model
description: TPC-DS retail semantic model for sales and customer analytics
ai_context:
  instructions: Use this semantic model for retail analytics. It provides comprehensive sales, customer, product, and store data from the TPC-DS benchmark. The model supports time-based analysis, customer segmentation, product performance, and store operations metrics.
datasets:
- name: store_sales
  source: SLSTUDY.TPCDS_SF1.store_sales
  primary_key:
  - ss_item_sk
  - ss_ticket_number
  unique_keys:
  - - ss_item_sk
    - ss_ticket_number
  description: Fact table containing all store sales transactions
  ai_context:
    synonyms:
    - sales transactions
    - store purchases
    - retail sales
    - POS data
  fields:
  - name: ss_sold_date_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_sold_date_sk
    description: Foreign key to date dimension
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - sale date
      - transaction date
  - name: ss_item_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_item_sk
    description: Foreign key to item dimension
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - product
      - item
  - name: ss_ticket_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_ticket_number
    description: Ticket number identifying the sales transaction
    datatype: Integer
    dimension:
      is_time: false
  - name: ss_customer_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_customer_sk
    description: Foreign key to customer dimension
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - customer
      - buyer
  - name: ss_store_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_store_sk
    description: Foreign key to store dimension
    datatype: Integer
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - store
      - location
  - name: ss_quantity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_quantity
    description: Quantity of items sold
    datatype: Integer
    ai_context:
      synonyms:
      - units sold
      - quantity
  - name: ss_sales_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_sales_price
    description: Sales price per unit
    datatype: Decimal
    ai_context:
      synonyms:
      - unit price
      - price
  - name: ss_ext_sales_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_ext_sales_price
    description: Extended sales price (quantity * price)
    datatype: Decimal
    ai_context:
      synonyms:
      - total price
      - line total
  - name: ss_net_profit
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_net_profit
    description: Net profit from the sale
    datatype: Decimal
    ai_context:
      synonyms:
      - profit
  - name: ss_net_paid
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_net_paid
    description: Net amount paid after discounts and coupons, excluding tax
    datatype: Decimal
  - name: ss_net_paid_inc_tax
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_net_paid_inc_tax
    description: Net amount paid after discounts and coupons, including tax
    datatype: Decimal
  - name: ss_ext_wholesale_cost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_ext_wholesale_cost
    description: Extended wholesale cost (quantity × unit wholesale cost)
    datatype: Decimal
  - name: ss_coupon_amt
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: ss_coupon_amt
    description: Coupon amount applied to the sale line
    datatype: Decimal
  metrics:
  - name: total_quantity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(ss_quantity)
    description: Total quantity sold across all store sales
    datatype: Integer
- name: date_dim
  source: SLSTUDY.TPCDS_SF1.date_dim
  primary_key:
  - d_date_sk
  unique_keys:
  - - d_date_sk
  description: Date dimension with calendar attributes
  ai_context:
    synonyms:
    - calendar
    - dates
    - time periods
  fields:
  - name: d_date_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_date_sk
    description: Surrogate key for date
    datatype: Integer
    dimension:
      is_time: false
  - name: d_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_date
    description: Actual date value
    datatype: Date
    dimension: {}
    ai_context:
      synonyms:
      - date
      - calendar date
  - name: d_year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_year
    description: Year
    datatype: Integer
    dimension:
      is_time: true
    ai_context:
      synonyms:
      - year
  - name: d_quarter_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_quarter_name
    description: Quarter name (e.g., 2024Q1)
    dimension:
      is_time: true
    ai_context:
      synonyms:
      - quarter
  - name: d_moy
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_moy
    description: Month of year (1-12)
    dimension:
      is_time: true
    ai_context:
      synonyms:
      - month
  - name: fiscal_year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CASE WHEN d_moy >= 2 THEN d_year ELSE d_year - 1 END
    dimension:
      is_time: false
    description: Fiscal year. The fiscal year starts on 1 February and is named for the calendar year in which it starts (FY2000 runs from 1 February 2000 to 31 January 2001)
    datatype: Integer
    ai_context:
      synonyms:
      - fiscal year
      - FY
  - name: fiscal_quarter
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: FLOOR(MOD(d_moy + 10, 12) / 3) + 1
    dimension:
      is_time: false
    description: Fiscal quarter (1-4) within the fiscal year; Q1 is February to April
    datatype: Integer
    ai_context:
      synonyms:
      - fiscal quarter
  - name: is_weekend
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d_weekend = 'Y'
    dimension:
      is_time: false
    description: True when the date falls on a weekend (source flag d_weekend = 'Y')
    datatype: Boolean
    ai_context:
      synonyms:
      - weekend
- name: customer
  source: SLSTUDY.TPCDS_SF1.customer
  primary_key:
  - c_customer_sk
  unique_keys:
  - - c_customer_sk
  - - c_customer_id
  description: Customer dimension with demographic information
  ai_context:
    synonyms:
    - customers
    - shoppers
    - buyers
  fields:
  - name: c_customer_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c_customer_sk
    description: Surrogate key for customer
    datatype: Integer
    dimension:
      is_time: false
  - name: c_customer_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c_customer_id
    description: Business key for customer
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - customer ID
      - customer number
  - name: c_first_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c_first_name
    description: Customer first name
    datatype: String
    dimension:
      is_time: false
  - name: c_last_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c_last_name
    description: Customer last name
    datatype: String
    dimension:
      is_time: false
  - name: customer_full_name
    expression:
      sql: c_first_name || ' ' || c_last_name
      dialects:
      - dialect: ANSI_SQL
        expression: c_first_name || ' ' || c_last_name
    description: Customer full name (computed field)
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - full name
      - customer name
  - name: c_email_address
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c_email_address
    description: Customer email address
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - email
      - contact
  - name: c_birth_year
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c_birth_year
    dimension:
      is_time: false
    description: Customer's year of birth
    datatype: Integer
    ai_context:
      synonyms:
      - birth year
  - name: is_preferred_customer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: c_preferred_cust_flag = 'Y'
    dimension:
      is_time: false
    description: True when the customer is enrolled in the preferred-customer program (source flag c_preferred_cust_flag = 'Y')
    datatype: Boolean
    ai_context:
      synonyms:
      - preferred customer
      - preferred
- name: item
  source: SLSTUDY.TPCDS_SF1.item
  primary_key:
  - i_item_sk
  unique_keys:
  - - i_item_sk
  description: Item/Product dimension with product attributes
  ai_context:
    synonyms:
    - products
    - items
    - merchandise
  fields:
  - name: i_item_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: i_item_sk
    description: Surrogate key for item
    datatype: Integer
    dimension:
      is_time: false
  - name: i_item_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: i_item_id
    description: Business key for item
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - item ID
      - product ID
      - SKU
  - name: i_item_desc
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: i_item_desc
    description: Item description
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - product description
      - item name
  - name: i_brand
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: i_brand
    description: Brand name
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - brand
      - manufacturer
  - name: i_category
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: i_category
    description: Item category
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - product category
      - department
  - name: i_current_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: i_current_price
    description: Current price of the item
    datatype: Decimal
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - price
      - list price
  - name: i_class
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: i_class
    dimension:
      is_time: false
    description: Item class within a category
    datatype: String
    ai_context:
      synonyms:
      - item class
      - class
  - name: is_apparel
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: i_category IN ('Men', 'Women', 'Children')
    dimension:
      is_time: false
    description: True for apparel items, defined as the Men, Women and Children categories
    datatype: Boolean
    ai_context:
      synonyms:
      - apparel
      - clothing
- name: store
  source: SLSTUDY.TPCDS_SF1.store
  primary_key:
  - s_store_sk
  unique_keys:
  - - s_store_sk
  description: Store dimension with location and store attributes
  ai_context:
    synonyms:
    - stores
    - retail locations
    - branches
  fields:
  - name: s_store_sk
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: s_store_sk
    description: Surrogate key for store
    datatype: Integer
    dimension:
      is_time: false
  - name: s_store_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: s_store_id
    description: Business key for store
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - store ID
      - store number
  - name: s_store_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: s_store_name
    description: Store name
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - store name
      - location name
  - name: s_city
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: s_city
    description: City where store is located
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - city
      - location
  - name: s_state
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: s_state
    description: State where store is located
    datatype: String
    dimension:
      is_time: false
    ai_context:
      synonyms:
      - state
      - region
  - name: s_number_employees
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: s_number_employees
    description: Number of employees at the store
    datatype: Integer
    ai_context:
      synonyms:
      - employee count
      - staff size
  - name: store_size_class
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: CASE WHEN s_number_employees >= 270 THEN 'large' ELSE 'standard' END
    dimension:
      is_time: false
    description: 'Store size class: ''large'' when the store has at least 270 employees, otherwise ''standard'''
    datatype: String
    ai_context:
      synonyms:
      - store size
      - large store
relationships:
- name: store_sales_to_date
  from: store_sales
  to: date_dim
  from_columns:
  - ss_sold_date_sk
  to_columns:
  - d_date_sk
  ai_context:
    synonyms:
    - sales date relationship
    - when sale occurred
- name: store_sales_to_customer
  from: store_sales
  to: customer
  from_columns:
  - ss_customer_sk
  to_columns:
  - c_customer_sk
  ai_context:
    synonyms:
    - customer purchase relationship
    - who bought
    instructions: 'Each sale links to the purchasing customer: store_sales.ss_customer_sk = customer.c_customer_sk.'
- name: store_sales_to_item
  from: store_sales
  to: item
  from_columns:
  - ss_item_sk
  to_columns:
  - i_item_sk
  ai_context:
    synonyms:
    - product sold relationship
    - what was sold
- name: store_sales_to_store
  from: store_sales
  to: store
  from_columns:
  - ss_store_sk
  to_columns:
  - s_store_sk
  ai_context:
    synonyms:
    - store location relationship
    - where sale occurred
    instructions: 'Each sale links to the store where it took place: store_sales.ss_store_sk = store.s_store_sk.'
metrics:
- name: total_sales
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(store_sales.ss_ext_sales_price)
  description: 'Total sales revenue: sum of the extended sales price (quantity × unit sales price, before discounts and coupons) across all store sales transactions'
  datatype: Decimal
  ai_context:
    synonyms:
    - total revenue
    - gross sales
    - sales amount
- name: total_profit
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(store_sales.ss_net_profit)
  description: 'Total net profit from store sales: net amount paid (after discounts and coupons, excluding tax) minus the extended wholesale cost'
  datatype: Decimal
  ai_context:
    synonyms:
    - net profit
    - total earnings
    - profit
- name: customer_lifetime_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(store_sales.ss_ext_sales_price) / COUNT(customer.c_customer_sk)
  description: 'Average sales value per customer purchase line: total extended sales price divided by the number of sales lines with a customer'
  datatype: Decimal
  ai_context:
    synonyms:
    - CLV
    - LTV
    - customer value
    - lifetime revenue
- name: sales_by_brand
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(store_sales.ss_ext_sales_price)
  description: Total sales by brand (requires grouping by item.i_brand)
  datatype: Decimal
  ai_context:
    synonyms:
    - brand sales
    - brand performance
    - brand revenue
- name: store_productivity
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(store_sales.ss_ext_sales_price) / NULLIF(MAX(store.s_number_employees), 0)
  description: 'Sales per employee for one store: total extended sales price divided by the store''s number of employees (requires grouping by store)'
  datatype: Decimal
  ai_context:
    synonyms:
    - sales per employee
    - employee productivity
    - revenue per employee
- name: cumulative_sales
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(SUM(store_sales.ss_ext_sales_price)) OVER (ORDER BY date_dim.d_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)
  description: Running total of sales revenue by date (requires grouping by date_dim.d_date)
  datatype: Decimal
  ai_context:
    synonyms:
    - running total sales
    - cumulative revenue
    - sales to date
- name: brand_rank_in_store
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: RANK() OVER (PARTITION BY store.s_store_sk ORDER BY SUM(store_sales.ss_ext_sales_price) DESC)
  description: Rank of each brand by sales within a store, 1 = highest (requires grouping by store.s_store_sk and item.i_brand)
  datatype: Integer
  ai_context:
    synonyms:
    - brand ranking by store
    - top brands per store
    - store brand leaderboard
- name: monthly_sales_change
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(store_sales.ss_ext_sales_price) - LAG(SUM(store_sales.ss_ext_sales_price), 1) OVER (ORDER BY date_dim.d_year, date_dim.d_moy)
  description: Sales revenue change versus the previous month (requires grouping by date_dim.d_year and date_dim.d_moy)
  datatype: Decimal
  ai_context:
    synonyms:
    - month over month sales change
    - MoM sales
    - sales delta
- name: net_sales
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(store_sales.ss_net_paid)
  description: 'Net sales: net amount paid after discounts and coupons, excluding tax'
  datatype: Decimal
  ai_context:
    synonyms:
    - net revenue
    - sales after discounts
- name: gross_profit
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(store_sales.ss_ext_sales_price - store_sales.ss_ext_wholesale_cost)
  description: 'Gross profit: extended sales price minus extended wholesale cost, before discounts and coupons'
  datatype: Decimal
  ai_context:
    synonyms:
    - gross margin dollars
    - profit before discounts
- name: average_ticket_value
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(store_sales.ss_ext_sales_price) / COUNT(DISTINCT store_sales.ss_ticket_number)
  description: 'Average value of a sales ticket: total extended sales price divided by the number of distinct tickets'
  datatype: Decimal
  ai_context:
    synonyms:
    - average basket value
    - average transaction value
- name: distinct_customers
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(DISTINCT store_sales.ss_customer_sk)
  description: Number of distinct identified customers with at least one store purchase
  datatype: Integer
  ai_context:
    synonyms:
    - unique customers
    - customer count
